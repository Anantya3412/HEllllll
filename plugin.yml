name: RivalSMP
version: 1.0.0
main: com.rivalsmp.RivalSMP
api-version: '1.21.11'
author: RivalSMP
description: RivalSMP server utilities, announcements and player information.
commands:
  rivalsmp:
    description: Main RivalSMP command.
    usage: /rivalsmp [help|reload|info]
    aliases: [rival]
  announce:
    description: Broadcast a server announcement.
    usage: /announce <message>
permissions:
  rivalsmp.admin:
    description: Allows managing RivalSMP settings and announcements.
    default: op
